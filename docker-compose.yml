name: campus-drop

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campus_drop}
      POSTGRES_USER: ${POSTGRES_USER:-campus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus_dev_password_2026}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - campus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-campus_user}:${POSTGRES_PASSWORD:-campus_dev_password_2026}@postgres:5432/${POSTGRES_DB:-campus_drop}
      JWT_SECRET: ${JWT_SECRET:-campus-drop-local-development-secret-change-me-2026}
      DELIVERY_PIN_SECRET: ${DELIVERY_PIN_SECRET:-campus-drop-delivery-pin-secret-change-me-2026}
      CORS_ORIGIN: http://localhost:3000,http://localhost:8082
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@campusdrop.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-CampusDropAdmin2026}
      LOCAL_DEMO_OTP: "true"
    ports:
      - "4000:4000"
      - "4002:4000"
    volumes:
      - campus_uploads:/app/uploads
    command: >
      sh -c "node node_modules/typeorm/cli.js migration:run -d dist/database/data-source.js
      && (node dist/database/bootstrap-admin.js || true)
      && node dist/main.js"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  admin:
    image: node:22-bookworm-slim
    restart: unless-stopped
    working_dir: /workspace
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: development
      API_URL: http://backend:4000/v1
      BACKEND_URL: http://backend:4000/v1
      NEXT_PUBLIC_API_URL: http://localhost:4000/v1
      NEXT_PUBLIC_BACKEND_URL: http://localhost:4000/v1
    ports:
      - "${ADMIN_PORT:-3002}:3000"
    volumes:
      - ../campus admin:/workspace
      - campus_admin_node_modules:/workspace/node_modules
      - campus_admin_next:/workspace/.next
    command: sh -c "npm install --package-lock=false --no-audit --no-fund && npm run dev -- -H 0.0.0.0"

  app:
    image: node:22-bookworm-slim
    restart: unless-stopped
    working_dir: /workspace
    depends_on:
      backend:
        condition: service_healthy
    environment:
      EXPO_PUBLIC_WEB_API_URL: http://localhost:4002/v1
      EXPO_PUBLIC_API_URL: http://10.144.142.231:4002/v1
    ports:
      - "8082:8082"
    volumes:
      - ../campus app:/workspace
      - campus_app_node_modules:/workspace/node_modules
    command: sh -c "npm install --package-lock=false --no-audit --no-fund && npx expo start --web --port 8082"

volumes:
  campus_postgres_data:
  campus_uploads:
  campus_admin_node_modules:
  campus_admin_next:
  campus_app_node_modules:
